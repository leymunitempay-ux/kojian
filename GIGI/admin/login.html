<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 — 星冕 Admin</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0B0D">
<link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
<script>
(function(){try{var t=JSON.parse(localStorage.getItem('xingmian_settings')||'null');var m=(t&&t.theme)||'dark';var d=m==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):m;document.documentElement.setAttribute('data-theme',d);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
</script>
<link rel="stylesheet" href="../assets/css/reset.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/global.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body class="admin-login-body" data-admin-page="login" data-root="..">

  <div class="vr-backdrop"></div>
  <div class="orb orb-neon" style="width:480px;height:480px;top:-160px;right:-120px"></div>
  <div class="orb orb-cyan" style="width:420px;height:420px;bottom:-160px;left:-140px"></div>

  <div class="login-card glass">
    <a class="logo" href="../index.html">星冕<span class="dot">.</span></a>
    <h1>管理后台</h1>
    <p class="sub">欢迎回来，请登录以管理内容</p>
    <div class="login-error" id="login-error"></div>
    <form id="login-form" class="grid" style="gap:16px">
      <div class="field">
        <label>账号</label>
        <input class="input" id="login-user" autocomplete="username" placeholder="请输入账号" required>
      </div>
      <div class="field">
        <label>密码</label>
        <input class="input" id="login-pass" type="password" autocomplete="current-password" placeholder="请输入密码" required>
      </div>
      <button class="btn btn-neon btn-lg" type="submit">登 录</button>
    </form>
    <div class="login-hint" id="login-hint"></div>
  </div>

  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/db.js"></script>
  <script src="../assets/js/md.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/fx.js"></script>
  <script src="../assets/js/admin.js"></script>
</body>
</html>
