  <main class="site-wrap">
    <section class="page-hero">
      <div class="ph-inner">
        <nav class="breadcrumb">
          <a href="../index.html">首页</a><span class="sep">/</span><span>关于</span>

        <h1 class="h1"><span data-name>星冕</span></h1>
        <p data-title>Creator / Developer / Designer</p>
      </div>
    </section>

    <section class="section--tight container">

        <div class="pos-relative">

          <div class="contact-methods" data-about-contact></div>
        </div>

            <h2 class="h2" style="margin:14px 0">用代码、设计与创意<br>构建我的数字宇宙</h2>

            <div style="margin-top:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px">

            <div style="margin-top:24px">

              <div class="info-card glass" style="padding:18px"><dl data-experience></dl></div>
            </div>
          </div>
        </div>

    <!-- 技能 -->

        <span class="eyebrow">Skills</span>

      </div>
      <div id="skills-list" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(24px,3vw,48px)"></div>
    </section>

    <!-- 时间线 -->

      <div class="section-head reveal">
        <span class="eyebrow">Timeline</span>
        <h2 class="h1" style="margin-top:14px">成长时间线</h2>
      </div>
      <div id="timeline" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(24px,4vw,64px)"></div>
